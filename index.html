<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Una página web sencilla de bienvenida."
    />
    <title>Hola, mundo</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <span class="eyebrow">Una página sencilla</span>
      <h1>¡Hola, mundo!</h1>
      <p id="greeting" aria-live="polite">
        Un pequeño espacio para dar vida a tus ideas.
      </p>
      <button id="greeting-button" type="button">Cambiar saludo</button>
    </main>
    <aside class="clock" role="img" aria-labelledby="clock-time">
      <span class="clock-face" aria-hidden="true">
        <span class="clock-hand clock-hand--hour"></span>
        <span class="clock-hand clock-hand--minute"></span>
        <span class="clock-hand clock-hand--second"></span>
        <span class="clock-pin"></span>
      </span>
      <time id="clock-time" class="visually-hidden"></time>
    </aside>
  </body>
</html>
